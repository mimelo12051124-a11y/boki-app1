<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18324b"><title>簿記2級 商業簿記 20問トレーニング</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#18324b;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}header{background:#18324b;color:white;padding:19px 16px}header>div,main{max-width:850px;margin:auto}h1{font-size:20px;margin:0}main{padding:16px 12px 60px}.card{background:white;border:1px solid #e1e8ee;border-radius:16px;padding:19px;margin:0 0 14px;box-shadow:0 3px 14px #19334a0b}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:14px 0 9px}.muted{color:#65778a;font-size:13px;line-height:1.65}p{line-height:1.8}button,select,input{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:13px 18px;font-weight:700}button.primary{background:#196b9a;color:white}button.secondary{background:#e8f1f7;color:#164b6d}button.danger{background:#fff1f0;color:#a3312d}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}.actions button{flex:1;min-width:145px}.pill{display:inline-block;background:#eaf2f8;color:#215d82;border-radius:50px;padding:5px 10px;font-size:12px;font-weight:700}.progress{height:9px;background:#e5edf2;border-radius:50px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:#2883b4;transition:width .2s}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{background:#f0f6fa;border-radius:12px;padding:12px;text-align:center}.stat strong{display:block;font-size:23px}.stat span{font-size:12px;color:#61768a}.entry{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 36px;gap:6px;margin:7px 0}.entry select,.entry input{min-width:0;width:100%;border:1px solid #c5d3dd;border-radius:8px;padding:10px 7px;background:white;color:#18324b;font-size:14px}.entry .manual-account:not([hidden]){grid-column:1}.entry [hidden]{display:none!important}.entry button{padding:0;background:#f0f4f7;color:#5a6e7b}.side{padding:11px;background:#f8fafc;border-radius:12px;margin:12px 0}.side h3{margin:0 0 9px}.side .add{font-size:13px;padding:8px 12px;background:#e8f1f7;color:#16587e}.feedback{padding:15px;border-radius:12px;background:#f1f7fa;margin-top:14px}.feedback.good{background:#eaf8ef}.feedback.bad{background:#fff2ec}.journal{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}.journal th,.journal td{border-bottom:1px solid #dce5eb;padding:9px 6px;text-align:left}.journal th{background:#eaf1f6}.topic{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #edf1f4;font-size:13px}.tiny{font-size:12px}.hidden{display:none!important}@media(min-width:650px){.sides{display:grid;grid-template-columns:1fr 1fr;gap:12px}.entry{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 32px}}@media(max-width:360px){.card{padding:13px}.entry select,.entry input{font-size:12px}}
</style></head><body><header><div><h1>📘 簿記2級 商業簿記</h1><div style="opacity:.8;font-size:13px;margin-top:4px">20問仕訳トレーニング · 個人用</div></div></header><main id="app"></main><script>
const BANK=[{"id": "q1", "cat": "商品売買", "sub": "売上原価対立法", "p": "商品80,000円を掛けで販売した。商品の原価は52,000円。売上原価対立法で仕訳しなさい。", "d": [["売掛金", 80000], ["売上原価", 52000]], "c": [["売上", 80000], ["商品", 52000]], "e": "売価で売掛金・売上を計上し、同時に原価を商品から売上原価へ振り替えます。"}, {"id": "q2", "cat": "商品売買", "sub": "返品", "p": "掛けで仕入れた商品12,000円を返品した。三分法で仕訳しなさい。", "d": [["買掛金", 12000]], "c": [["仕入", 12000]], "e": "仕入の取消しなので仕入を貸方に記入し、買掛金を減らします。"}, {"id": "q3", "cat": "商品売買", "sub": "割戻", "p": "仕入先から仕入割戻5,000円を受け、買掛金から差し引いた。三分法で仕訳しなさい。", "d": [["買掛金", 5000]], "c": [["仕入", 5000]], "e": "仕入割戻は仕入額の減額として処理します。"}, {"id": "q4", "cat": "商品売買", "sub": "諸掛り", "p": "商品90,000円を掛けで仕入れ、引取運賃3,000円を現金で支払った。三分法で仕訳しなさい。", "d": [["仕入", 93000]], "c": [["買掛金", 90000], ["現金", 3000]], "e": "当社負担の仕入諸掛りは仕入原価に含めます。"}, {"id": "q5", "cat": "現金および預金", "sub": "現金過不足", "p": "現金実査額が帳簿残高より4,000円少なかった。原因は不明である。", "d": [["現金過不足", 4000]], "c": [["現金", 4000]], "e": "現金の不足は現金を減らし、原因が判明するまでは現金過不足で処理します。"}, {"id": "q6", "cat": "現金および預金", "sub": "当座借越", "p": "当座預金残高20,000円の状態で小切手35,000円を振り出して買掛金を支払った。二勘定制で処理しなさい。", "d": [["買掛金", 35000]], "c": [["当座預金", 20000], ["当座借越", 15000]], "e": "預金残高を超えた15,000円は当座借越という負債になります。"}, {"id": "q7", "cat": "債権・債務", "sub": "手形", "p": "得意先への売掛金70,000円について、同社振出しの約束手形を受け取った。", "d": [["受取手形", 70000]], "c": [["売掛金", 70000]], "e": "売掛金を手形債権に振り替えます。"}, {"id": "q8", "cat": "債権・債務", "sub": "手形割引", "p": "額面100,000円の受取手形を銀行で割り引き、割引料2,000円を差し引いた金額が普通預金に入金された。", "d": [["普通預金", 98000], ["手形売却損", 2000]], "c": [["受取手形", 100000]], "e": "手形の割引は手形の売却として処理し、割引料を手形売却損にします。"}, {"id": "q9", "cat": "債権・債務", "sub": "クレジット売掛金", "p": "商品50,000円をクレジット払いで販売した。信販会社の手数料は売上代金の4%で、販売時に認識する。", "d": [["クレジット売掛金", 48000], ["支払手数料", 2000]], "c": [["売上", 50000]], "e": "手数料2,000円を控除した48,000円がクレジット売掛金です。"}, {"id": "q10", "cat": "債権・債務", "sub": "電子記録債権", "p": "売掛金60,000円について電子記録債権の発生記録を行った。", "d": [["電子記録債権", 60000]], "c": [["売掛金", 60000]], "e": "売掛金が電子記録債権へ変わります。"}, {"id": "q11", "cat": "債権・債務", "sub": "電子記録債務", "p": "買掛金45,000円について電子記録債務の発生記録を行った。", "d": [["買掛金", 45000]], "c": [["電子記録債務", 45000]], "e": "買掛金を電子記録債務へ振り替えます。"}, {"id": "q12", "cat": "有価証券", "sub": "購入", "p": "売買目的で株式100株を1株800円で購入し、購入手数料2,000円とともに普通預金から支払った。", "d": [["売買目的有価証券", 82000]], "c": [["普通預金", 82000]], "e": "購入手数料は有価証券の取得原価に含めます。"}, {"id": "q13", "cat": "有価証券", "sub": "売却", "p": "帳簿価額75,000円の売買目的有価証券を82,000円で売却し、普通預金に入金された。", "d": [["普通預金", 82000]], "c": [["売買目的有価証券", 75000], ["有価証券売却益", 7000]], "e": "売却額と帳簿価額の差7,000円が売却益です。"}, {"id": "q14", "cat": "有価証券", "sub": "評価", "p": "決算にあたり帳簿価額120,000円の売買目的有価証券を時価113,000円に評価替えした。", "d": [["有価証券評価損", 7000]], "c": [["売買目的有価証券", 7000]], "e": "売買目的有価証券は決算時に時価評価し、差額を損益に計上します。"}, {"id": "q15", "cat": "有形固定資産", "sub": "購入（割賦購入）", "p": "備品を割賦購入した。現金購入価額120,000円、分割手数料12,000円、支払総額132,000円を後払いとする。利息部分は前払費用として処理する。", "d": [["備品", 120000], ["前払費用", 12000]], "c": [["未払金", 132000]], "e": "備品の取得原価は現金購入価額です。分割手数料は指定に従い前払費用に計上します。"}, {"id": "q16", "cat": "有形固定資産", "sub": "減価償却", "p": "取得原価600,000円、残存価額0円、耐用年数5年の備品について定額法で1年分の減価償却を行う。間接法による。", "d": [["減価償却費", 120000]], "c": [["備品減価償却累計額", 120000]], "e": "600,000÷5＝120,000円です。間接法では減価償却累計額を貸方に計上します。"}, {"id": "q17", "cat": "有形固定資産", "sub": "売却", "p": "取得原価400,000円、減価償却累計額250,000円の備品を130,000円で売却し、代金を普通預金で受け取った。間接法による。", "d": [["普通預金", 130000], ["備品減価償却累計額", 250000], ["固定資産売却損", 20000]], "c": [["備品", 400000]], "e": "帳簿価額150,000円に対し売却額130,000円なので売却損20,000円です。"}, {"id": "q18", "cat": "有形固定資産", "sub": "買換", "p": "帳簿価額80,000円の旧備品を下取り価額50,000円で引き渡し、新備品200,000円を購入した。差額150,000円は普通預金から支払った。旧備品の取得原価は180,000円、減価償却累計額100,000円である。 同一勘定科目の備品について新旧を区別して入力する必要はない。", "d": [["備品", 200000], ["備品減価償却累計額", 100000], ["固定資産売却損", 30000]], "c": [["備品", 180000], ["普通預金", 150000]], "e": "下取りは旧備品の売却と新備品の取得を組み合わせた取引です。旧備品の損失は30,000円です。"}, {"id": "q19", "cat": "有形固定資産", "sub": "除却", "p": "取得原価300,000円、減価償却累計額270,000円の備品を除却した。処分価値はない。", "d": [["備品減価償却累計額", 270000], ["固定資産除却損", 30000]], "c": [["備品", 300000]], "e": "帳簿価額30,000円がそのまま除却損です。"}, {"id": "q20", "cat": "有形固定資産", "sub": "建設仮勘定", "p": "建設中の建物の工事代金300,000円を普通預金から支払った。完成はしていない。", "d": [["建設仮勘定", 300000]], "c": [["普通預金", 300000]], "e": "完成前の建設支出は建設仮勘定で処理します。"}, {"id": "q21", "cat": "有形固定資産", "sub": "改良と修繕", "p": "建物の改良費80,000円と通常の修繕費20,000円を普通預金から支払った。", "d": [["建物", 80000], ["修繕費", 20000]], "c": [["普通預金", 100000]], "e": "価値や耐用年数を増加させる改良は資産、原状回復の修繕は費用です。"}, {"id": "q22", "cat": "有形固定資産", "sub": "未決算勘定", "p": "火災により帳簿価額90,000円の備品が滅失した。保険に加入しており、保険金額は未確定である。取得原価200,000円、減価償却累計額110,000円。", "d": [["備品減価償却累計額", 110000], ["火災未決算", 90000]], "c": [["備品", 200000]], "e": "保険金額が未確定の間は帳簿価額を火災未決算に振り替えます。"}, {"id": "q23", "cat": "有形固定資産", "sub": "圧縮記帳", "p": "国庫補助金100,000円を普通預金で受け取った。補助金受領時の仕訳をしなさい。", "d": [["普通預金", 100000]], "c": [["国庫補助金受贈益", 100000]], "e": "補助金を受領した時点では国庫補助金受贈益を計上します。圧縮記帳は別途行います。"}, {"id": "q24", "cat": "リース取引", "sub": "ファイナンス・リース", "p": "所有権移転外ファイナンス・リース契約を開始した。リース資産・債務の計上額は480,000円と算定された。利子抜き法による。", "d": [["リース資産", 480000]], "c": [["リース債務", 480000]], "e": "ファイナンス・リースの開始時にはリース資産とリース債務を両建てします。"}, {"id": "q25", "cat": "リース取引", "sub": "リース料支払", "p": "ファイナンス・リース料100,000円を普通預金から支払った。うち元本返済分90,000円、利息10,000円である。利子抜き法による。", "d": [["リース債務", 90000], ["支払利息", 10000]], "c": [["普通預金", 100000]], "e": "元本返済はリース債務の減少、利息は支払利息です。"}, {"id": "q26", "cat": "無形固定資産等と研究開発費", "sub": "ソフトウェア", "p": "自社利用のソフトウェアを200,000円で購入し、普通預金から支払った。資産計上の要件を満たす。", "d": [["ソフトウェア", 200000]], "c": [["普通預金", 200000]], "e": "資産計上の要件を満たす自社利用ソフトウェアは無形固定資産です。"}, {"id": "q27", "cat": "無形固定資産等と研究開発費", "sub": "研究開発費", "p": "新製品の研究開発に使用する材料60,000円を現金で購入し、直ちに研究開発に使用した。", "d": [["研究開発費", 60000]], "c": [["現金", 60000]], "e": "研究開発費は発生時に費用として処理します。"}, {"id": "q28", "cat": "引当金", "sub": "貸倒引当金", "p": "決算時の売掛金残高500,000円に対し2%の貸倒引当金を設定する。既存の貸倒引当金残高は3,000円。差額補充法による。", "d": [["貸倒引当金繰入", 7000]], "c": [["貸倒引当金", 7000]], "e": "必要額10,000円から既存残高3,000円を差し引き7,000円を繰り入れます。"}, {"id": "q29", "cat": "引当金", "sub": "その他の引当金", "p": "当期に発生した製品保証費用の将来支出見積額40,000円を製品保証引当金として計上する。", "d": [["製品保証引当金繰入", 40000]], "c": [["製品保証引当金", 40000]], "e": "当期の販売に対応する将来の保証費用を見積計上します。"}, {"id": "q30", "cat": "外貨建取引", "sub": "決算時換算", "p": "外貨建売掛金1,000ドル（取引時1ドル140円）を決算時レート1ドル145円で換算する。", "d": [["売掛金", 5000]], "c": [["為替差損益", 5000]], "e": "決算時評価額145,000円と帳簿価額140,000円との差5,000円は為替差益です。"}, {"id": "q31", "cat": "税金", "sub": "法人税等", "p": "決算にあたり法人税、住民税及び事業税が120,000円と確定した。中間納付額は50,000円で仮払法人税等に計上済みである。", "d": [["法人税、住民税及び事業税", 120000]], "c": [["仮払法人税等", 50000], ["未払法人税等", 70000]], "e": "税額全額を費用とし、中間納付分を控除した残額が未払です。"}, {"id": "q32", "cat": "税金", "sub": "消費税", "p": "税抜方式で、決算時の仮受消費税等が90,000円、仮払消費税等が65,000円であった。", "d": [["仮受消費税等", 90000]], "c": [["仮払消費税等", 65000], ["未払消費税等", 25000]], "e": "仮受と仮払を相殺し、差額25,000円を未払消費税等にします。"}, {"id": "q33", "cat": "税効果会計", "sub": "繰延税金資産", "p": "会計上の貸倒引当金のうち税務上損金不算入となる額が30,000円発生した。法定実効税率30%。将来減算一時差異について繰延税金資産を計上できるものとする。", "d": [["繰延税金資産", 9000]], "c": [["法人税等調整額", 9000]], "e": "将来減算一時差異30,000円×30%＝9,000円の繰延税金資産を計上します。"}, {"id": "q34", "cat": "税効果会計", "sub": "繰延税金負債", "p": "その他有価証券の評価差額（税効果適用前）が20,000円の評価益であった。全部純資産直入法、法定実効税率30%で税効果を適用する。", "d": [["その他有価証券", 20000]], "c": [["繰延税金負債", 6000], ["その他有価証券評価差額金", 14000]], "e": "評価益20,000円の税効果6,000円は繰延税金負債、残り14,000円は純資産です。"}, {"id": "q35", "cat": "株式の発行", "sub": "設立時", "p": "会社設立にあたり株式を発行し、払込金額300,000円が普通預金に入金された。全額を資本金とする。", "d": [["普通預金", 300000]], "c": [["資本金", 300000]], "e": "払込金の全額を資本金に計上します。"}, {"id": "q36", "cat": "株式の発行", "sub": "増資時", "p": "新株発行により500,000円が普通預金に払い込まれた。会社法で認められる最低額を資本金とする。", "d": [["普通預金", 500000]], "c": [["資本金", 250000], ["資本準備金", 250000]], "e": "払込額の2分の1までを資本金に組み入れず資本準備金とすることができます。"}, {"id": "q37", "cat": "株式の発行", "sub": "株式申込証拠金", "p": "株式申込証拠金150,000円を別段預金で受け入れた。払込期日前である。", "d": [["別段預金", 150000]], "c": [["株式申込証拠金", 150000]], "e": "払込期日前の受入額は株式申込証拠金で処理します。"}, {"id": "q38", "cat": "純資産", "sub": "剰余金の配当と処分", "p": "繰越利益剰余金を原資として株主配当100,000円を決議した。利益準備金10,000円も積み立てる。", "d": [["繰越利益剰余金", 110000]], "c": [["未払配当金", 100000], ["利益準備金", 10000]], "e": "配当金と利益準備金の合計を繰越利益剰余金から減らします。"}, {"id": "q39", "cat": "純資産", "sub": "株主資本の計数変動", "p": "その他資本剰余金70,000円を資本金に組み入れることを決議した。", "d": [["その他資本剰余金", 70000]], "c": [["資本金", 70000]], "e": "純資産内の振替であり、資産・負債や損益は変化しません。"}, {"id": "q40", "cat": "収益・費用の認識基準", "sub": "商品販売業", "p": "商品120,000円の注文を受け、手付金20,000円を現金で受け取った。商品はまだ引き渡していない。", "d": [["現金", 20000]], "c": [["前受金", 20000]], "e": "商品を引き渡す前の手付金は売上ではなく前受金です。"}, {"id": "q41", "cat": "収益・費用の認識基準", "sub": "サービス業", "p": "役務提供契約に関し、当期に提供を完了したサービス50,000円を売掛金として計上する。", "d": [["売掛金", 50000]], "c": [["役務収益", 50000]], "e": "サービスの提供が完了した部分を役務収益として認識します。"}, {"id": "q42", "cat": "本支店会計", "sub": "本店と支店", "p": "本店が支店へ商品80,000円（原価）を発送した。支店独立会計制度を採用し、内部利益は付加しない。本店側の仕訳を答えなさい。", "d": [["支店", 80000]], "c": [["仕入", 80000]], "e": "本店では支店勘定を借方に計上し、仕入を減らします（三分法）。"}, {"id": "q43", "cat": "合併・事業譲渡", "sub": "事業譲受", "p": "他社の事業を現金300,000円で譲り受けた。受け入れた資産は400,000円、引き受けた負債は150,000円で、差額はのれんとする。", "d": [["諸資産", 400000], ["のれん", 50000]], "c": [["諸負債", 150000], ["現金", 300000]], "e": "受入純資産250,000円より支払対価が50,000円多いため、のれんを計上します。諸資産・諸負債は設問上の集約科目です。"}, {"id": "q44", "cat": "連結会計", "sub": "投資と資本の相殺", "p": "P社はS社の株式80%を160,000円で取得し支配した。取得日のS社純資産の時価は180,000円（資本金180,000円のみ）である。のれん・非支配株主持分を含む連結修正仕訳を答えなさい。", "d": [["資本金", 180000], ["のれん", 16000]], "c": [["子会社株式", 160000], ["非支配株主持分", 36000]], "e": "非支配株主持分は180,000×20%=36,000円。のれんは160,000−180,000×80%=16,000円です。"}, {"id": "q45", "cat": "連結会計", "sub": "内部取引の相殺", "p": "P社がS社へ商品100,000円を掛けで販売した。連結上の売上高と売上原価を相殺する修正仕訳を答えなさい。", "d": [["売上高", 100000]], "c": [["売上原価", 100000]], "e": "企業集団内の売上・仕入は連結上相殺します。債権債務の相殺は別の修正仕訳です。"}, {"id": "q46", "cat": "連結会計", "sub": "債権債務の相殺", "p": "決算日に親会社の子会社に対する売掛金が60,000円あり、子会社側には同額の買掛金が計上されている。連結修正仕訳を答えなさい。", "d": [["買掛金", 60000]], "c": [["売掛金", 60000]], "e": "グループ内の債権・債務は連結財務諸表では相殺消去します。"}];
const KEY='boki2_20_v2';let store={history:[],missed:[]};try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.history)&&Array.isArray(s.missed))store=s}catch(e){}
let session=null;const app=document.getElementById('app');
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>Number(n).toLocaleString('ja-JP');
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
function sample(arr,n){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)}
const cats=[...new Set(BANK.map(q=>q.cat))];
function home(){session=null;let total=store.history.length,correct=store.history.reduce((s,x)=>s+x.correct,0),attempted=store.history.reduce((s,x)=>s+x.total,0);app.innerHTML=`<section class="card"><h2>20問チャレンジ</h2><p>画像で指定された商業簿記の範囲から、毎回ランダムに20問を出題します。1問ずつ採点し、すぐに解説を確認できます。</p><div class="stats"><div class="stat"><strong>${total}</strong><span>挑戦回数</span></div><div class="stat"><strong>${attempted?Math.round(correct/attempted*100):0}%</strong><span>累計正答率</span></div><div class="stat"><strong>${store.missed.length}</strong><span>復習待ち</span></div></div><div class="actions"><button class="primary" onclick="start(false)">20問を始める</button><button class="secondary" onclick="start(true)" ${store.missed.length?'':'disabled'}>間違えた問題を復習 (${store.missed.length})</button></div><p class="muted">難易度設定なし・制限時間なし。借方・貸方の仕訳行は自由に追加できます。正誤判定では行順を問いません。</p></section><section class="card"><h2>出題範囲</h2>${cats.map(c=>`<div class="topic"><span>${escapeHtml(c)}</span><span class="muted">${BANK.filter(x=>x.cat===c).length}パターン</span></div>`).join('')}<p class="muted">全${BANK.length}パターンを収録。問題文の金額は現在固定で、出題順と問題の組み合わせがランダムです。</p></section><section class="card"><h2>過去の成績</h2>${total?store.history.slice(-10).reverse().map(h=>`<div class="topic"><span>${escapeHtml(h.date)} ${h.review?'復習':'20問'}</span><strong>${h.correct}/${h.total}問 (${Math.round(h.correct/h.total*100)}%)</strong></div>`).join(''):'<p class="muted">まだ記録がありません。</p>'}<div class="actions"><button class="danger" onclick="resetHistory()">学習記録を消去</button></div><p class="muted">記録はこのブラウザ内に保存されます。別端末への同期はありません。</p></section>`}
function start(review){let pool=review?BANK.filter(q=>store.missed.includes(q.id)):BANK; if(!pool.length){home();return}session={questions:sample(pool,review?pool.length:20),index:0,answers:[],review,checked:false};renderQuestion()}
const accounts=[...new Set(BANK.flatMap(q=>[...q.d,...q.c].map(x=>x[0])))].sort((a,b)=>a.localeCompare(b,'ja'));
function choices(q){
 const correct=[...new Set([...q.d,...q.c].map(x=>x[0]))];
 const related=[...new Set(BANK.filter(x=>x.cat===q.cat).flatMap(x=>[...x.d,...x.c].map(y=>y[0])))].filter(x=>!correct.includes(x));
 const others=accounts.filter(x=>!correct.includes(x)&&!related.includes(x));
 return [...correct,...sample(related,7-correct.length),...sample(others,Math.max(0,7-correct.length-related.length))].slice(0,7).sort((a,b)=>a.localeCompare(b,'ja'));
}
function opts(){return '<option value="">勘定科目を選択</option>'+session.choices.map(x=>`<option value="${escapeHtml(x)}">${escapeHtml(x)}</option>`).join('')+'<option value="__manual__">✏️ 直接入力する</option>'}
function toggleManual(el){const inp=el.parentElement.querySelector('.manual-account');if(el.value==='__manual__'){el.hidden=true;inp.hidden=false;inp.focus()}}
function entry(side,i){return `<div class="entry"><select aria-label="${side==='d'?'借方':'貸方'}科目" onchange="toggleManual(this)">${opts()}</select><input class="manual-account" type="text" placeholder="勘定科目を入力" aria-label="勘定科目を直接入力" hidden><input class="amount" type="number" min="0" step="1" inputmode="numeric" placeholder="金額" aria-label="金額"><button aria-label="行を削除" onclick="this.parentElement.remove()">×</button></div>`}
function addRow(side){let el=document.getElementById('rows-'+side);el.insertAdjacentHTML('beforeend',entry(side,el.children.length))}
function renderQuestion(){let q=session.questions[session.index],i=session.index,n=session.questions.length;session.checked=false;session.choices=choices(q);app.innerHTML=`<section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="pill">${session.review?'復習モード':'20問チャレンジ'}</span><strong>${i+1} / ${n} 問</strong></div><div class="progress"><div style="width:${i/n*100}%"></div></div><p class="muted">${escapeHtml(q.cat)} ／ ${escapeHtml(q.sub)}</p><h2>第${i+1}問</h2><p>${escapeHtml(q.p)}</p><p class="muted">勘定科目は問題ごとの7候補から選択、または「✏️ 直接入力する」を選べます。</p><div class="sides">${['d','c'].map(side=>`<div class="side"><h3>${side==='d'?'借方':'貸方'}</h3><div id="rows-${side}">${entry(side,0)}${entry(side,1)}</div><button class="add" onclick="addRow('${side}')">＋ 行を追加</button></div>`).join('')}</div><div id="feedback"></div><div class="actions" id="submit-actions"><button class="primary" onclick="grade()">採点する</button></div></section>`}
function rows(side){return [...document.querySelectorAll(`#rows-${side} .entry`)].map(el=>{const sel=el.querySelector('select');const manual=el.querySelector('.manual-account');const input=el.querySelector('.amount');return {account:(sel.value==='__manual__'?manual.value:sel.value).trim().replace(/[\s　]/g,''),amount:Number(input.value),raw:input.value}}).filter(x=>x.account||x.raw)}
function normalize(arr){let m={};for(const [a,n] of arr){m[a]=(m[a]||0)+Number(n)}return Object.entries(m).filter(x=>x[1]!==0).sort((a,b)=>a[0].localeCompare(b[0],'ja'))}
function equal(a,b){return JSON.stringify(normalize(a))===JSON.stringify(normalize(b))}
function grade(){if(session.checked)return;let q=session.questions[session.index],d=rows('d'),c=rows('c');if(!d.length&&!c.length){alert('借方と貸方を入力してください。');return}if([...d,...c].some(x=>!x.account||!x.raw||x.amount<=0||!Number.isInteger(x.amount))){alert('入力した行の勘定科目と金額（正の整数）をすべて入力してください。');return}let ok=equal(d.map(x=>[x.account,x.amount]),q.d)&&equal(c.map(x=>[x.account,x.amount]),q.c);session.checked=true;session.answers.push({id:q.id,ok});if(ok){store.missed=store.missed.filter(x=>x!==q.id)}else if(!store.missed.includes(q.id)){store.missed.push(q.id)}save();document.querySelectorAll('.entry select,.entry input,.entry button,.side .add').forEach(x=>x.disabled=true);let fb=document.getElementById('feedback');fb.innerHTML=`<div class="feedback ${ok?'good':'bad'}"><h3>${ok?'✅ 正解です！':'❌ 不正解です'}</h3><strong>正しい仕訳</strong><table class="journal"><thead><tr><th>借方科目</th><th>金額</th><th>貸方科目</th><th>金額</th></tr></thead><tbody>${Array.from({length:Math.max(q.d.length,q.c.length)},(_,i)=>`<tr><td>${escapeHtml(q.d[i]?.[0]||'')}</td><td>${q.d[i]?yen(q.d[i][1]):''}</td><td>${escapeHtml(q.c[i]?.[0]||'')}</td><td>${q.c[i]?yen(q.c[i][1]):''}</td></tr>`).join('')}</tbody></table><h3>解説</h3><p>${escapeHtml(q.e)}</p></div>`;document.getElementById('submit-actions').innerHTML=`<button class="primary" onclick="next()">${session.index===session.questions.length-1?'結果を見る':'次の問題へ →'}</button>`;fb.scrollIntoView({behavior:'smooth',block:'nearest'})}
function next(){if(!session.checked)return;session.index++;if(session.index>=session.questions.length){finish()}else renderQuestion()}
function finish(){let n=session.answers.length,k=session.answers.filter(a=>a.ok).length,review=session.review;store.history.push({date:new Date().toLocaleDateString('ja-JP'),correct:k,total:n,review});save();let missed=session.answers.filter(x=>!x.ok).map(x=>BANK.find(q=>q.id===x.id));app.innerHTML=`<section class="card"><span class="pill">${review?'復習結果':'20問チャレンジ結果'}</span><h2 style="margin-top:15px">お疲れさまでした！</h2><div class="stats"><div class="stat"><strong>${k}</strong><span>正解</span></div><div class="stat"><strong>${n-k}</strong><span>不正解</span></div><div class="stat"><strong>${Math.round(k/n*100)}%</strong><span>正答率</span></div></div><p>${n}問中 <strong>${k}問正解</strong> でした。</p><div class="actions"><button class="primary" onclick="start(false)">新しく20問に挑戦</button><button class="secondary" onclick="start(true)" ${store.missed.length?'':'disabled'}>間違えた問題を復習 (${store.missed.length})</button><button class="secondary" onclick="home()">ホームへ</button></div></section><section class="card"><h2>今回間違えた問題</h2>${missed.length?missed.map(q=>`<div class="topic"><span>${escapeHtml(q.cat)}：${escapeHtml(q.sub)}</span><span class="muted">要復習</span></div>`).join(''):'<p>全問正解です！ 🎉</p>'}<p class="muted">復習待ちは過去の不正解も含みます。復習で正解すると一覧から外れます。</p></section>`;window.scrollTo(0,0)}
function resetHistory(){if(confirm('学習履歴と復習待ちをすべて消去しますか？')){store={history:[],missed:[]};save();home()}}
home();
</script></body></html>
